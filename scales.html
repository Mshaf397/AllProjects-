<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Scale Calculator with Mode Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: monospace, sans-serif;
        }

        .eink-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            box-shadow: none !important;
        }

        .eink-button {
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            font-weight: bold;
            border-radius: 6px;
        }
        .eink-button:active {
            background: #ffffff;
            color: #000000;
        }

        .eink-chip {
            background: #f0f0f0;
            border: 1px solid #000000;
            color: #000000;
            font-weight: bold;
            border-radius: 4px;
        }

        .bit-active {
            font-weight: bold;
            text-decoration: underline;
        }

        textarea {
            border: 2px solid #000000 !important;
            background: #ffffff !important;
            color: #000000 !important;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #000000;
            padding: 4px 6px;
            text-align: center;
            font-size: 11px;
        }

        th {
            background-color: #e5e5e5;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="max-w-2xl w-full space-y-6">
        <header class="text-center space-y-2 mb-4 border-b-2 border-black pb-4">
            <h1 class="text-3xl font-black tracking-tighter uppercase">
                Binary Scale & Mode Matrix
            </h1>
            <p class="text-sm font-semibold">Map large integers to EDO microtonal structures and modal rotations (E-Ink Edition).</p>
        </header>

        <section class="eink-card p-4 space-y-4">
            <div class="flex justify-between items-end">
                <label for="numberInput" class="text-xs font-bold uppercase tracking-wider">Input Integer</label>
                <button onclick="clearInput()" class="text-xs font-bold underline cursor-pointer">Clear</button>
            </div>
            <textarea 
                id="numberInput" 
                placeholder="Enter positive integer..." 
                class="w-full p-3 rounded text-sm font-mono outline-none resize-none h-24"
            ></textarea>
            
            <button 
                onclick="calculateScale()"
                class="eink-button w-full py-3 px-4 text-sm flex items-center justify-center gap-2 cursor-pointer"
            >
                Generate Scale & Mode Matrix
            </button>
        </section>

        <div id="errorMessage" class="hidden border-2 border-black p-3 text-sm text-center font-bold"></div>

        <main id="results" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="eink-card p-3">
                    <span class="text-[10px] font-bold uppercase tracking-wider block">Tuning System</span>
                    <p id="edoValue" class="text-xl font-black mt-1"></p>
                </div>
                <div class="eink-card p-3">
                    <span class="text-[10px] font-bold uppercase tracking-wider block">Bit Complexity</span>
                    <p id="bitLength" class="text-xl font-black mt-1"></p>
                </div>
            </div>

            <div class="eink-card p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-black uppercase">Scale Degrees</h2>
                    <button id="copyBtn" onclick="copyToClipboard()" class="eink-button text-xs px-3 py-1.5 cursor-pointer">
                        Copy Steps
                    </button>
                </div>
                <div id="stepsContainer" class="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto p-1"></div>
            </div>

            <div class="eink-card p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-black uppercase">Auto-Generated Mode Matrix</h2>
                    <span id="matrixInfo" class="text-[10px] font-bold uppercase"></span>
                </div>
                <div class="overflow-x-auto max-h-64">
                    <table id="matrixTable">
                        <tbody id="matrixBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="eink-card p-4">
                <span class="text-[10px] font-bold uppercase block mb-2">Binary Sequence Map</span>
                <div id="binaryVisual" class="font-mono text-xs break-all leading-relaxed p-2 border border-black bg-gray-50"></div>
            </div>
        </main>
    </div>

    <script>
        function calculateScale() {
            const rawInput = document.getElementById('numberInput').value.trim();
            const cleanedInput = rawInput.replace(/[,.\s]/g, '');
            
            const errorDiv = document.getElementById('errorMessage');
            const resultsDiv = document.getElementById('results');
            const stepsContainer = document.getElementById('stepsContainer');
            const binaryVisual = document.getElementById('binaryVisual');
            const matrixBody = document.getElementById('matrixBody');
            const matrixInfo = document.getElementById('matrixInfo');
            
            errorDiv.classList.add('hidden');
            
            try {
                if (!cleanedInput) throw new Error("Please enter a numerical value.");
                if (!/^\d+$/.test(cleanedInput)) throw new Error("Input contains invalid non-numeric characters.");

                const num = BigInt(cleanedInput);
                if (num <= 0n) throw new Error("Value must be a positive integer.");

                const binaryStr = num.toString(2);
                const bitLength = binaryStr.length;
                
                const edo = bitLength; 
                const maxStep = edo - 1;

                document.getElementById('edoValue').innerText = `${edo}-EDO`;
                document.getElementById('bitLength').innerText = `${bitLength}-bit`;

                let steps = [];
                let visualHtml = '';

                for (let i = 0; i < bitLength; i++) {
                    const bit = binaryStr[i];
                    const position = bitLength - 1 - i;
                    const edoStep = maxStep - position;

                    if (bit === '1') {
                        steps.push(edoStep);
                        visualHtml += `<span class="bit-active">${bit}</span>`;
                    } else {
                        visualHtml += `<span>${bit}</span>`;
                    }
                }

                stepsContainer.innerHTML = steps.map(s => `
                    <div class="eink-chip px-2.5 py-1 text-xs font-mono">
                        ${s}
                    </div>
                `).join('');

                binaryVisual.innerHTML = visualHtml;

                // Memory-efficient Mode Matrix Generation (Rotations of active step intervals)
                if (steps.length === 0) {
                    matrixBody.innerHTML = '<tr><td class="p-2 text-xs">No active notes found.</td></tr>';
                    matrixInfo.innerText = '';
                } else {
                    let matrixHtml = '';
                    const numModes = steps.length;
                    matrixInfo.innerText = `${numModes} Rotations`;

                    // Table Header
                    matrixHtml += '<tr><th>Mode</th>';
                    for (let i = 0; i < numModes; i++) {
                        matrixHtml += `<th>Deg ${i+1}</th>`;
                    }
                    matrixHtml += '<th>Interval Intervals</th></tr>';

                    // Compute intervals between scale degrees for each mode rotation
                    for (let m = 0; m < numModes; m++) {
                        matrixHtml += `<tr><td class="font-bold">M${m+1}</td>`;
                        
                        let rotatedSteps = [];
                        for (let i = 0; i < numModes; i++) {
                            rotatedSteps.push(steps[(i + m) % numModes]);
                        }

                        // Normalize relative to rotation root (Root = 0)
                        const rootVal = rotatedSteps[0];
                        let normalizedIntervals = [];
                        
                        for (let i = 0; i < numModes; i++) {
                            let diff = rotatedSteps[i] - rootVal;
                            if (diff < 0) diff += edo;
                            normalizedIntervals.push(diff);
                            matrixHtml += `<td>${rotatedSteps[i]}</td>`;
                        }

                        matrixHtml += `<td class="font-mono text-[10px]">[${normalizedIntervals.join(', ')}]</td></tr>`;
                    }

                    matrixBody.innerHTML = matrixHtml;
                }

                resultsDiv.classList.remove('hidden');

            } catch (e) {
                errorDiv.innerText = e.message;
                errorDiv.classList.remove('hidden');
                resultsDiv.classList.add('hidden');
            }
        }

        function copyToClipboard() {
            const btn = document.getElementById('copyBtn');
            const chips = Array.from(document.querySelectorAll('.eink-chip'));
            const text = chips.map(el => el.innerText.trim()).join(', ');
            
            if (!text) return;

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const originalText = btn.innerText;
                    btn.innerText = "Copied!";
                    setTimeout(() => {
                        btn.innerText = originalText;
                    }, 2000);
                } else {
                    console.error("Copy command failed.");
                }
            } catch (err) {
                console.error('Fallback copy failed', err);
            }

            document.body.removeChild(textArea);
        }

        function clearInput() {
            document.getElementById('numberInput').value = '';
            document.getElementById('results').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
        }
    </script>
</body>
</html>
