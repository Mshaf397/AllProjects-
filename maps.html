<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle Map Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --ui-bg: #f0f0f0;
            --border-width: 2px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* E-Ink High Contrast Filter */
        #map {
            height: 100%;
            width: 100%;
            background: #fff;
            filter: grayscale(100%) contrast(1.4);
        }

        /* UI Containers */
        .search-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1001;
            width: calc(100% - 130px);
            max-width: 450px;
        }

        .search-bar {
            display: flex;
            box-shadow: 4px 4px 0px #000;
            background: #fff;
            border: var(--border-width) solid #000;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border: none;
            font-size: 18px;
            outline: none;
            background: transparent;
            min-width: 0; /* Prevents flex items from overflowing */
        }

        /* Clear Button (X) */
        .clear-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            font-weight: bold;
            padding: 0 15px;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-btn:active {
            background: #eee;
        }

        .search-btn {
            background: #000;
            color: #fff;
            border: none;
            border-left: var(--border-width) solid #000;
            padding: 0 20px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        /* Search Results List */
        #resultsList {
            display: none;
            background: #fff;
            border: var(--border-width) solid #000;
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 4px 4px 0px #000;
        }

        .result-item {
            padding: 15px;
            border-bottom: 1px solid #ccc;
            font-size: 16px;
            cursor: pointer;
            color: #000;
        }

        .result-item:active {
            background-color: #000;
            color: #fff;
        }

        /* Large Touch Controls */
        .custom-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: var(--ui-bg);
            border: var(--border-width) solid #000;
            color: #000;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-width: 60px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-decoration: none;
        }

        /* 24-hour Clock */
        #clock {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            background: #fff;
            padding: 8px 12px;
            border: 2px solid #000;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 3px 3px 0px #000;
        }

        /* Leaflet Scale Styling */
        .leaflet-control-scale-line {
            border: 2px solid #000 !important;
            border-top: none !important;
            background: #fff !important;
            color: #000 !important;
            font-weight: bold !important;
            font-size: 14px !important;
        }

        .leaflet-control-zoom {
            display: none;
        }

        /* Active Tracking Button State */
        .btn.active-tracking {
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="search-bar">
            <input type="text" id="locationInput" placeholder="Location..." oninput="handleInput()">
            <button class="clear-btn" onclick="clearSearch()" id="clearBtn">×</button>
            <button class="search-btn" onclick="searchLocation()">Go</button>
        </div>
        <div id="resultsList"></div>
    </div>

    <div class="custom-controls">
        <div class="btn" onclick="map.zoomIn()">+</div>
        <div class="btn" onclick="map.zoomOut()">−</div>
        <div class="btn" onclick="locateUser()">◎</div>
    </div>

    <div id="clock">00:00</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let updateTimer = null;
        let activeMarker = null;
        let accuracyCircle = null;
        let watchId = null;
        let isTracking = false;

        // Expanded popular/preset locations list for instant robust search results
        const PRESET_LOCATIONS = [
            { name: "Mohegan Lake, NY", lat: 41.3259, lon: -73.8504 },
            { name: "New York City, NY", lat: 40.7128, lon: -74.0060 },
            { name: "White Plains, NY", lat: 41.0340, lon: -73.7629 },
            { name: "Peekskill, NY", lat: 41.2901, lon: -73.9174 },
            { name: "Yorktown Heights, NY", lat: 41.2754, lon: -73.7840 },
            { name: "Boston, MA", lat: 42.3601, lon: -71.0589 },
            { name: "Washington, D.C.", lat: 38.9072, lon: -77.0369 },
            { name: "San Francisco, CA", lat: 37.7749, lon: -122.4194 },
            { name: "London, United Kingdom", lat: 51.5074, lon: -0.1278 },
            { name: "Paris, France", lat: 48.8566, lon: 2.3522 },
            { name: "Tokyo, Japan", lat: 35.6762, lon: 139.6503 },
            { name: "Sydney, Australia", lat: -33.8688, lon: 151.2093 }
        ];

        function initMap() {
            // Check URL hash for initial coordinates and zoom: #lat,lon,zoom
            let initialLat = 41.3259;
            let initialLon = -73.8504;
            let initialZoom = 14;

            const hash = window.location.hash.substring(1);
            if (hash) {
                const parts = hash.split(',');
                if (parts.length >= 2) {
                    const parsedLat = parseFloat(parts[0]);
                    const parsedLon = parseFloat(parts[1]);
                    const parsedZoom = parts[2] ? parseInt(parts[2], 10) : 14;
                    if (!isNaN(parsedLat) && !isNaN(parsedLon)) {
                        initialLat = parsedLat;
                        initialLon = parsedLon;
                        if (!isNaN(parsedZoom)) initialZoom = parsedZoom;
                    }
                }
            }

            // Initialize map with resolved or default view
            map = L.map('map', {
                zoomControl: false,
                tap: true,
                attributionControl: false
            }).setView([initialLat, initialLon], initialZoom);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            L.control.scale({
                position: 'bottomright',
                imperial: true,
                metric: true
            }).addTo(map);

            updateTime();
            setInterval(updateTime, 60000);

            // Throttle URL hash updates on map movement to preserve smooth scrolling
            map.on('moveend', () => {
                if (updateTimer) clearTimeout(updateTimer);
                updateTimer = setTimeout(() => {
                    const center = map.getCenter();
                    const zoom = map.getZoom();
                    const newHash = `${center.lat.toFixed(4)},${center.lon.toFixed(4)},${zoom}`;
                    history.replaceState(null, null, `#${newHash}`);
                }, 300);
            });

            // Stop live tracking if user manually drags/pans the map
            map.on('dragstart', () => {
                if (isTracking) {
                    stopTracking();
                }
            });

            map.on('mousedown', () => {
                document.getElementById('resultsList').style.display = 'none';
            });
        }

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }

        function clearSearch() {
            const input = document.getElementById('locationInput');
            input.value = '';
            input.focus();
            document.getElementById('resultsList').style.display = 'none';
        }

        function handleInput() {
            const query = document.getElementById('locationInput').value.trim();
            if (query.length >= 2) {
                showPresetMatches(query);
            } else {
                document.getElementById('resultsList').style.display = 'none';
            }
        }

        function showPresetMatches(query) {
            const resultsDiv = document.getElementById('resultsList');
            const lowerQuery = query.toLowerCase();
            
            const matchedPresets = PRESET_LOCATIONS.filter(item => 
                item.name.toLowerCase().includes(lowerQuery)
            );

            if (matchedPresets.length > 0) {
                resultsDiv.innerHTML = '';
                matchedPresets.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.textContent = item.name;
                    div.onclick = () => {
                        map.setView([item.lat, item.lon], 15);
                        resultsDiv.style.display = 'none';
                        document.getElementById('locationInput').value = item.name;
                    };
                    resultsDiv.appendChild(div);
                });
                resultsDiv.style.display = 'block';
            } else {
                resultsDiv.style.display = 'none';
            }
        }

        async function searchLocation() {
            const query = document.getElementById('locationInput').value.trim();
            const resultsDiv = document.getElementById('resultsList');
            
            if (!query) return;

            const lowerQuery = query.toLowerCase();
            const exactPreset = PRESET_LOCATIONS.find(item => item.name.toLowerCase() === lowerQuery);
            if (exactPreset) {
                map.setView([exactPreset.lat, exactPreset.lon], 15);
                resultsDiv.style.display = 'none';
                return;
            }

            resultsDiv.innerHTML = '<div class="result-item">Searching...</div>';
            resultsDiv.style.display = 'block';

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8000`);
                const data = await response.json();
                
                resultsDiv.innerHTML = '';
                
                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div class="result-item">No results found.</div>';
                } else {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.textContent = item.display_name.split(',').slice(0, 3).join(',');
                        div.onclick = () => {
                            map.setView([item.lat, item.lon], 15);
                            resultsDiv.style.display = 'none';
                            document.getElementById('locationInput').value = div.textContent;
                        };
                        resultsDiv.appendChild(div);
                    });
                }
            } catch (e) {
                resultsDiv.innerHTML = '<div class="result-item">Error fetching data.</div>';
            }
        }

        function locateUser() {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        }

        function startTracking() {
            if (!("geolocation" in navigator)) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            const btn = document.getElementById('trackBtn');

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    isTracking = true;
                    if (btn) btn.classList.add('active-tracking');

                    // Center map on updated position
                    map.setView([lat, lon], Math.max(map.getZoom(), 15));

                    // High contrast E-Ink custom tracking marker
                    const userIcon = L.divIcon({
                        className: 'custom-user-pin',
                        html: '<div style="background-color: #000; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #000;"></div>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });

                    if (activeMarker) {
                        activeMarker.setLatLng([lat, lon]);
                    } else {
                        activeMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map);
                    }

                    if (accuracyCircle) {
                        accuracyCircle.setLatLng([lat, lon]);
                        accuracyCircle.setRadius(accuracy);
                    } else {
                        accuracyCircle = L.circle([lat, lon], {
                            radius: accuracy,
                            color: '#000',
                            fillColor: '#000',
                            fillOpacity: 0.1,
                            weight: 1
                        }).addTo(map);
                    }
                },
                (error) => {
                    let errorMessage = "Unable to retrieve position.";
                    if (error.code === error.PERMISSION_DENIED) {
                        errorMessage = "Location permission was denied.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        errorMessage = "Location information unavailable.";
                    } else if (error.code === error.TIMEOUT) {
                        errorMessage = "Location request timed out.";
                    }
                    alert(errorMessage);
                    stopTracking();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            isTracking = false;
            const btn = document.getElementById('trackBtn');
            if (btn) btn.classList.remove('active-tracking');
        }

        window.onload = initMap;
        window.onresize = () => { if(map) map.invalidateSize(); };
    </script>
</body>
</html>
