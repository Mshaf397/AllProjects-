                <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-mono rounded border border-slate-700 whitespace-nowrap transition" data-edo="31" data-gen="18" data-up="17" data-down="16" data-period="2/1" data-row="1" data-col="7">31EDO</button>

                <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-mono rounded border border-slate-700 whitespace-nowrap transition" data-edo="53" data-gen="31" data-up="30" data-down="29" data-period="2/1" data-row="1" data-col="7">53EDO</button>
                <button class="preset-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-mono rounded border border-slate-700 whitespace-nowrap transition" data-edo="41" data-gen="24" data-up="23" data-down="22" data-period="2/1" data-row="1" data-col="7">41EDO</button>

    <!-- Audio & Notation Engine Script -->
    <script>
        // --- State Management ---
        const state = {
            edo: 12,
            anchorFreq: 440.0,
            anchorStep: 0, // 0-indexed EDO step that equals anchorFreq
            
            // Generator Scale parameters
            genSteps: 7,
            periodFraction: 2.0, // multiplier of an octave (e.g., 2/1 = 2.0)
            genUp: 6,
            genDown: 5,
            
            // Matrix Grid parameters
            rowStep: 1,
            colStep: 7,
            gridRows: 5,
            gridCols: 7,
            matrixBase: 0, // EDO step at top-left corner
            
            // Synth parameters
            waveform: 'triangle',
            attack: 0.02,
            release: 0.3,
            volume: 0.5,
            
            // Generated Scale List (sorted unique EDO steps)
            scaleSteps: []
        };

        // --- Audio Context & Synth Nodes ---
        let audioCtx = null;
        let masterGain = null;
        const activeVoices = new Map(); // frequency -> { osc, gain }

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = state.volume;
                masterGain.connect(audioCtx.destination);
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, notationStr) {
            initAudio();
            if (!audioCtx) return;

            // Stop existing voice on same frequency if any
            stopTone(freq);

            const now = audioCtx.currentTime;
            
            // Oscillator
            const osc = audioCtx.createOscillator();
            osc.type = state.waveform;
            osc.frequency.setValueAtTime(freq, now);

            // Gain / Envelope
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(state.volume, now + state.attack);

            osc.connect(gainNode);
            gainNode.connect(masterGain);

            osc.start(now);
            activeVoices.set(freq, { osc, gainNode, startTime: now });

            // Update UI display
            document.getElementById('active-notation').textContent = notationStr;
            document.getElementById('active-freq').textContent = freq.toFixed(2) + ' Hz';
        }

        function stopTone(freq) {
            if (!audioCtx || !activeVoices.has(freq)) return;
            const voice = activeVoices.get(freq);
            const now = audioCtx.currentTime;

            voice.gainNode.gain.cancelScheduledValues(now);
            voice.gainNode.gain.setValueAtTime(voice.gainNode.gain.value, now);
            voice.gainNode.gain.linearRampToValueAtTime(0.0001, now + state.release);

            setTimeout(() => {
                try {
                    voice.osc.stop();
                    voice.osc.disconnect();
                    voice.gainNode.disconnect();
                } catch (e) {}
            }, state.release * 1000 + 50);

            activeVoices.delete(freq);
        }

        function stopAllTones() {
            if (!audioCtx) return;
            activeVoices.forEach((voice, freq) => {
                try {
                    voice.osc.stop();
                    voice.osc.disconnect();
                    voice.gainNode.disconnect();
                } catch(e) {}
            });
            activeVoices.clear();
        }

        // --- Math & Microtonal Math Engine ---
        
        // Parses period fraction string like "1/1", "3/2", "2.0"
        function parseFraction(str) {
            if (!str) return 2.0;
            if (str.includes('/')) {
                const parts = str.split('/');
                const num = parseFloat(parts[0]);
                const den = parseFloat(parts[1]);
                if (!isNaN(num) && !isNaN(den) && den !== 0) {
                    return num / den;
                }
            }
            const val = parseFloat(str);
            return isNaN(val) ? 2.0 : val;
        }

        // Calculate exact frequency for a given EDO step index
        function calculateFrequency(edoStepIndex) {
            // EDO step 0_0 corresponds to state.anchorStep (default 0)
            const relativeStep = edoStepIndex - state.anchorStep;
            
            // Period multiplier factor: (periodFraction)^(1/EDO) per step
            // frequency = anchorFreq * (periodFraction ^ (relativeStep / EDO))
            const exponent = relativeStep / state.edo;
            const factor = Math.pow(state.periodFraction, exponent);
            return state.anchorFreq * factor;
        }

        // Format step index into 0-indexed EDO step notation with subscript octave
        // Format: Step_Octave (e.g. 0_0, 7_1, -3_-1)
        function formatEDONotation(edoStepIndex) {
            const edo = state.edo;
            
            // Mathematical modulo for negative numbers
            let step = edoStepIndex % edo;
            let octave = Math.floor(edoStepIndex / edo);
            if (step < 0) {
                step += edo;
            }

            // Return string with standard subscript representation or text fallback
            return `${step}<sub>${octave}</sub>`;
        }

        // Build array of scale steps using generator parameters
        function generateScale() {
            const steps = new Set();
            steps.add(0); // Always include root 0

            const gen = state.genSteps;
            
            // Generators Up
            for (let i = 1; i <= state.genUp; i++) {
                steps.add(i * gen);
            }
            
            // Generators Down
            for (let i = 1; i <= state.genDown; i++) {
                steps.add(-i * gen);
            }

            // Convert to sorted array
            state.scaleSteps = Array.from(steps).sort((a, b) => a - b);
            updateScaleStatusLabel();
        }

        function updateScaleStatusLabel() {
            const totalGen = state.genUp + state.genDown + 1;
            const statusEl = document.getElementById('scale-status');
            statusEl.textContent = `${state.edo}-EDO | ${totalGen} Notes Scale`;
        }

        // --- Dynamic Keyboard Matrix Generation ---
        function renderKeyboard() {
            const gridEl = document.getElementById('keyboard-grid');
            gridEl.innerHTML = '';

            const rows = state.gridRows;
            const cols = state.gridCols;

            // Configure CSS Grid dynamically
            gridEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            // Build set of relative scale steps (modulo EDO) for highlighting scale degrees
            const scaleModuloSet = new Set(
                state.scaleSteps.map(s => {
                    let m = s % state.edo;
                    return m < 0 ? m + state.edo : m;
                })
            );

            // Populate rows top-to-bottom
            for (let r = 0; r < rows; r++) {
                // Invert row index so higher pitches are at the top rows
                const rowIndexFromBottom = (rows - 1 - r);
                
                for (let c = 0; c < cols; c++) {
                    // Step index calculation based on row & col offsets
                    const stepIndex = state.matrixBase + (rowIndexFromBottom * state.rowStep) + (c * state.colStep);
                    const freq = calculateFrequency(stepIndex);
                    
                    // Modulo step for scale membership check
                    let stepMod = stepIndex % state.edo;
                    if (stepMod < 0) stepMod += state.edo;
                    
                    const inScale = scaleModuloSet.has(stepMod);
                    const isRoot = (stepMod === 0);

                    // Create key element
                    const keyBtn = document.createElement('button');
                    keyBtn.className = `relative flex flex-col items-center justify-center p-2 rounded-xl transition-all transform active:scale-95 select-none touch-none cursor-pointer border ${
                        isRoot 
                            ? 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-400 font-bold ring-2 ring-emerald-400/50' 
                            : inScale 
                                ? 'bg-slate-800 hover:bg-slate-700 text-emerald-300 border-slate-700' 
                                : 'bg-slate-900/90 hover:bg-slate-800 text-slate-500 border-slate-800/80 opacity-60'
                    }`;

                    const notationHTML = formatEDONotation(stepIndex);
                    
                    keyBtn.innerHTML = `
                        <span class="text-sm sm:text-base font-mono font-bold leading-tight">${notationHTML}</span>
                        <span class="text-[9px] sm:text-[10px] opacity-75 font-mono mt-0.5">${freq.toFixed(1)}Hz</span>
                    `;

                    // Handle interaction events for both touch and mouse
                    const triggerPlay = (e) => {
                        e.preventDefault();
                        keyBtn.classList.add('bg-emerald-400', 'text-slate-950', 'ring-4', 'ring-emerald-300');
                        // Strip HTML tags for clean notification string
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = notationHTML;
                        const cleanNotation = tempDiv.textContent || tempDiv.innerText || '';
                        playTone(freq, cleanNotation);
                    };

                    const triggerStop = (e) => {
                        e.preventDefault();
                        keyBtn.classList.remove('bg-emerald-400', 'text-slate-950', 'ring-4', 'ring-emerald-300');
                        stopTone(freq);
                    };

                    // Mouse Events
                    keyBtn.addEventListener('mousedown', triggerPlay);
                    keyBtn.addEventListener('mouseup', triggerStop);
                    keyBtn.addEventListener('mouseleave', triggerStop);

                    // Touch Events
                    keyBtn.addEventListener('touchstart', triggerPlay, { passive: false });
                    keyBtn.addEventListener('touchend', triggerStop, { passive: false });
                    keyBtn.addEventListener('touchcancel', triggerStop, { passive: false });

                    gridEl.appendChild(keyBtn);
                }
            }
        }

        // --- Event Listeners & UI Binding ---
        function bindInputs() {
            // Settings Panel Toggle (Mobile responsive)
            const toggleBtn = document.getElementById('toggle-settings');
            const panel = document.getElementById('settings-panel');
            toggleBtn.addEventListener('click', () => {
                panel.classList.toggle('hidden');
            });

            // EDO Input
            const inputEdo = document.getElementById('input-edo');
            inputEdo.addEventListener('change', (e) => {
                let val = parseInt(e.target.value);
                if (isNaN(val) || val < 1) val = 1;
                state.edo = val;
                generateScale();
                renderKeyboard();
            });

            // Anchor Frequency Input
            const inputAnchorFreq = document.getElementById('input-anchor-freq');
            inputAnchorFreq.addEventListener('change', (e) => {
                let val = parseFloat(e.target.value);
                if (isNaN(val) || val <= 0) val = 440;
                state.anchorFreq = val;
                renderKeyboard();
            });

            // Anchor EDO Step Index
            const inputAnchorStep = document.getElementById('input-anchor-step');
            inputAnchorStep.addEventListener('change', (e) => {
                let val = parseInt(e.target.value);
                if (isNaN(val)) val = 0;
                state.anchorStep = val;
                renderKeyboard();
            });

            // Scale Generator Inputs
            const btnApplyScale = document.getElementById('btn-apply-scale');
            btnApplyScale.addEventListener('click', () => {
                state.genSteps = parseInt(document.getElementById('input-gen-steps').value) || 0;
                state.periodFraction = parseFraction(document.getElementById('input-period-fraction').value);
                state.genUp = parseInt(document.getElementById('input-gen-up').value) || 0;
                state.genDown = parseInt(document.getElementById('input-gen-down').value) || 0;
                
                generateScale();
                renderKeyboard();
            });

            // Matrix Layout Inputs
            ['input-row-step', 'input-col-step', 'input-grid-rows', 'input-grid-cols', 'input-matrix-base'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => {
                    state.rowStep = parseInt(document.getElementById('input-row-step').value) || 1;
                    state.colStep = parseInt(document.getElementById('input-col-step').value) || 1;
                    state.gridRows = Math.max(1, parseInt(document.getElementById('input-grid-rows').value) || 5);
                    state.gridCols = Math.max(1, parseInt(document.getElementById('input-grid-cols').value) || 7);
                    state.matrixBase = parseInt(document.getElementById('input-matrix-base').value) || 0;
                    renderKeyboard();
                });
            });

            // Synth Audio Controls
            document.getElementById('select-waveform').addEventListener('change', (e) => {
                state.waveform = e.target.value;
            });
            document.getElementById('range-attack').addEventListener('input', (e) => {
                state.attack = parseFloat(e.target.value);
            });
            document.getElementById('range-release').addEventListener('input', (e) => {
                state.release = parseFloat(e.target.value);
            });
            document.getElementById('range-volume').addEventListener('input', (e) => {
                state.volume = parseFloat(e.target.value);
                if (masterGain) masterGain.gain.value = state.volume;
            });

            // Preset Buttons
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const edo = parseInt(btn.dataset.edo);
                    const gen = parseInt(btn.dataset.gen);
                    const up = parseInt(btn.dataset.up);
                    const down = parseInt(btn.dataset.down);
                    const period = btn.dataset.period;
                    const row = parseInt(btn.dataset.row);
                    const col = parseInt(btn.dataset.col);

                    state.edo = edo;
                    state.genSteps = gen;
                    state.genUp = up;
                    state.genDown = down;
                    state.periodFraction = parseFraction(period);
                    state.rowStep = row;
                    state.colStep = col;

                    // Update UI input values
                    document.getElementById('input-edo').value = edo;
                    document.getElementById('input-gen-steps').value = gen;
                    document.getElementById('input-gen-up').value = up;
                    document.getElementById('input-gen-down').value = down;
                    document.getElementById('input-period-fraction').value = period;
                    document.getElementById('input-row-step').value = row;
                    document.getElementById('input-col-step').value = col;

                    generateScale();
                    renderKeyboard();
                });
            });
        }

        // --- Application Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            bindInputs();
            generateScale();
            renderKeyboard();
        });
    </script>
</body>
</html>
