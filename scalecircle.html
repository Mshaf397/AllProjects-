<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDO Scale Circle Diagram (Paperwhite Ultralight)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      padding: 10px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { font-size: 18px; text-transform: uppercase; font-weight: 900; border-bottom: 3px solid #000; padding-bottom: 4px; }
    p.sub { font-size: 11px; font-weight: bold; color: #444; margin-top: 2px; margin-bottom: 10px; }
    .layout { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 600px) { .layout { display: grid; grid-template-columns: 260px 1fr; } }
    
    .panel { border: 3px solid #000; padding: 10px; background: #fff; }
    .field { margin-bottom: 8px; }
    label { display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px; }
    input[type="number"], textarea {
      width: 100%; border: 2px solid #000; padding: 4px; font-size: 14px; font-weight: bold; font-family: monospace;
    }
    textarea { height: 60px; resize: none; }
    
    .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .btn {
      background: #fff; color: #000; border: 2px solid #000; font-size: 10px; font-weight: 900;
      padding: 3px 6px; cursor: pointer; text-transform: uppercase;
    }
    .btn:hover { background: #000; color: #fff; }
    
    .row { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; font-weight: 900; }
    .summary { border: 2px solid #000; background: #f4f4f4; padding: 6px; font-family: monospace; font-size: 11px; font-weight: bold; margin-top: 8px; }
    
    .canvas-container {
      border: 3px solid #000; padding: 5px; display: flex; flex-direction: column; items-center: center; align-items: center; justify-content: center; background: #fff;
    }
    canvas { width: 100%; max-width: 380px; height: auto; aspect-ratio: 1; background: #fff; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: 10px; font-weight: 900; margin-top: 6px; }
    .leg-item { border: 1px solid #000; padding: 1px 4px; display: flex; align-items: center; gap: 3px; }
    .box { width: 8px; height: 8px; border: 1px solid #000; }
  </style>
</head>
<body>

  <h1>EDO Circle Generator</h1>
  <p class="sub">Paperwhite High-Contrast / Ultra-Low Memory Edition</p>

  <div class="layout">
    <!-- Form Controls -->
    <div class="panel">
      <div class="field">
        <label for="edoInput">EDO</label>
        <input type="number" id="edoInput" min="1" max="100" value="31">
      </div>

      <div class="field">
        <label for="stepsInput">Steps</label>
        <textarea id="stepsInput">5, 10, 15, 18, 23, 28, 30, 35, 40, 45, 48, 53, 58</textarea>
      </div>

      <label>Presets</label>
      <div class="presets">
        <button class="btn" onclick="p(31, '5 10 15 18 23 28 30 35 40 45 48 53 58')">31-Lydian</button>
        <button class="btn" onclick="p(12, '2 4 5 7 9 11')">12-Maj</button>
        <button class="btn" onclick="p(19, '3 6 8 11 14 17')">19-Maj</button>
        <button class="btn" onclick="p(22, '3 7 9 12 16 18')">22-Super</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="showNumbers" checked> Numbers</label>
        <label><input type="checkbox" id="connectPolygon" checked> Polygon</label>
      </div>

      <div class="summary">
        <div>Degrees: <span id="sDeg">0</span></div>
        <div>Octaves: <span id="sOct">1</span></div>
        <div>Pattern: <span id="sPat">-</span></div>
      </div>
    </div>

    <!-- Canvas Output -->
    <div class="canvas-container">
      <canvas id="c" width="400" height="400"></canvas>
      <div class="legend" id="leg"></div>
    </div>
  </div>

  <script>
    // Static references
    var eIn = document.getElementById('edoInput');
    var sIn = document.getElementById('stepsInput');
    var sNum = document.getElementById('showNumbers');
    var sPoly = document.getElementById('connectPolygon');
    var cv = document.getElementById('c');
    var cx = cv.getContext('2d');
    var elDeg = document.getElementById('sDeg');
    var elOct = document.getElementById('sOct');
    var elPat = document.getElementById('sPat');
    var elLeg = document.getElementById('leg');

    var octFills = ['#000000', '#ffffff', '#777777', '#dddddd'];
    var octTexts = ['#ffffff', '#000000', '#ffffff', '#000000'];

    function parseSteps(edo, text) {
      var arr = [];
      var hasZero = false;
      var max = 0;
      var match = text.match(/\d+/g);
      
      if (match) {
        for (var i = 0; i < match.length; i++) {
          var val = parseInt(match[i], 10);
          if (!isNaN(val)) {
            if (val === 0) hasZero = true;
            if (val > max) max = val;
            arr.push(val);
          }
        }
      }
      if (!hasZero) arr.push(0);

      // Simple in-place sort & unique
      arr.sort(function(a, b) { return a - b; });
      var clean = [];
      for (var j = 0; j < arr.length; j++) {
        if (j === 0 || arr[j] !== arr[j - 1]) clean.push(arr[j]);
      }
      return { steps: clean, max: max };
    }

    function render() {
      var edo = Math.max(1, parseInt(eIn.value, 10) || 12);
      var parsed = parseSteps(edo, sIn.value);
      var steps = parsed.steps;
      var numSteps = steps.length;
      var maxStep = parsed.max;
      
      var octs = maxStep >= edo ? Math.floor(maxStep / edo) + 1 : 1;
      var equave = octs * edo;

      // Update text nodes directly (low RAM)
      elDeg.innerText = numSteps;
      elOct.innerText = octs + ' (' + equave + ' steps)';

      var patStr = '';
      for (var k = 0; k < numSteps; k++) {
        var nxt = k < numSteps - 1 ? steps[k + 1] : equave;
        patStr += (k > 0 ? '-' : '') + (nxt - steps[k]);
      }
      elPat.innerText = patStr;

      // Render simple legend HTML
      var legHtml = '';
      for (var o = 0; o < octs; o++) {
        legHtml += '<div class="leg-item"><div class="box" style="background:' + octFills[o % 4] + '"></div>Oct ' + (o + 1) + '</div>';
      }
      elLeg.innerHTML = legHtml;

      // Clear Canvas (Fixed 400x400 context)
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, 400, 400);

      var center = 200;
      var maxR = 150;
      var minR = 70;
      var spacing = octs > 1 ? Math.min(25, (maxR - minR) / (octs - 1)) : 0;

      function getR(octIdx) {
        return octs === 1 ? maxR : maxR - (octIdx * spacing);
      }

      // Draw Rings
      cx.strokeStyle = '#000000';
      for (var rIdx = 0; rIdx < octs; rIdx++) {
        var radius = getR(rIdx);
        cx.lineWidth = (rIdx === 0) ? 2 : 1;
        cx.beginPath();
        cx.arc(center, center, radius, 0, 6.28318);
        if (rIdx > 0) cx.setLineDash([3, 3]);
        cx.stroke();
        if (rIdx > 0) cx.setLineDash([]);
      }

      // Draw Radial Lines
      var twoPi = 6.2831853;
      var halfPi = 1.5707963;
      var outR = getR(0) + 6;
      var inR = getR(octs - 1) - 6;

      for (var s = 0; s < edo; s++) {
        var ang = (s / edo) * twoPi - halfPi;
        cx.lineWidth = (s === 0) ? 3 : 1;
        cx.strokeStyle = (s === 0) ? '#000000' : '#888888';
        cx.beginPath();
        cx.moveTo(center + inR * Math.cos(ang), center + inR * Math.sin(ang));
        cx.lineTo(center + outR * Math.cos(ang), center + outR * Math.sin(ang));
        cx.stroke();
      }

      // Single Pass Polygon Drawing (Zero array allocation)
      if (sPoly.checked && numSteps > 1) {
        cx.strokeStyle = '#000000';
        cx.lineWidth = 2;
        cx.setLineDash([4, 4]);
        cx.beginPath();
        
        for (var p = 0; p < numSteps; p++) {
          var pStep = steps[p];
          var pOct = Math.floor(pStep / edo);
          var pRad = getR(pOct);
          var pAng = ((pStep % edo) / edo) * twoPi - halfPi;
          var px = center + pRad * Math.cos(pAng);
          var py = center + pRad * Math.sin(pAng);

          if (p === 0) cx.moveTo(px, py);
          else cx.lineTo(px, py);
        }
        // Connect back to equave top
        cx.lineTo(center, center - getR(0));
        cx.stroke();
        cx.setLineDash([]);
      }

      // Draw Nodes & Labels (On the fly)
      var nRad = octs > 3 ? 10 : 12;
      var drawNums = sNum.checked;

      for (var n = 0; n < numSteps; n++) {
        var st = steps[n];
        var nOct = Math.floor(st / edo);
        var nRadius = getR(nOct);
        var nAng = ((st % edo) / edo) * twoPi - halfPi;
        var nx = center + nRadius * Math.cos(nAng);
        var ny = center + nRadius * Math.sin(nAng);

        cx.fillStyle = octFills[nOct % 4];
        cx.beginPath();
        cx.arc(nx, ny, nRad, 0, twoPi);
        cx.fill();

        cx.lineWidth = 2;
        cx.strokeStyle = '#000000';
        cx.stroke();

        if (nOct > 0) {
          cx.beginPath();
          cx.arc(nx, ny, nRad + 2, 0, twoPi);
          cx.lineWidth = 1;
          cx.stroke();
        }

        if (drawNums) {
          cx.fillStyle = octTexts[nOct % 4];
          cx.font = '900 10px sans-serif';
          cx.textAlign = 'center';
          cx.textBaseline = 'middle';
          cx.fillText(st.toString(), nx, ny + 0.5);
        }
      }

      // Center Text
      cx.fillStyle = '#000000';
      cx.textAlign = 'center';
      cx.textBaseline = 'middle';
      cx.font = '900 18px sans-serif';
      cx.fillText(edo + '-EDO', center, center - 6);
      cx.font = 'bold 10px sans-serif';
      cx.fillText(numSteps + ' DEGREES', center, center + 10);
    }

    function p(edo, steps) {
      eIn.value = edo;
      sIn.value = steps;
      render();
    }

    eIn.addEventListener('change', render);
    sIn.addEventListener('change', render);
    sNum.addEventListener('change', render);
    sPoly.addEventListener('change', render);

    window.onload = render;
  </script>
</body>
</html>
