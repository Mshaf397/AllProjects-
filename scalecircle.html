<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDO Scale Circle Diagram Generator (Kindle Paperwhite)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex flex-col items-center">

  <div class="max-w-5xl w-full flex flex-col gap-5">
    <!-- Header -->
    <header class="text-center border-b-4 border-black pb-3">
      <h1 class="text-2xl sm:text-3xl font-black text-black uppercase tracking-wider">
        EDO Scale Circle Generator
      </h1>
      <p class="text-xs sm:text-sm font-bold text-zinc-700 mt-1">
        Monochrome / E-Ink Optimized Edition for Kindle Paperwhite
      </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <!-- Input Panel -->
      <section class="lg:col-span-5 bg-white border-4 border-black p-4 rounded-none flex flex-col gap-4 shadow-none">
        <div>
          <h2 class="text-base font-black text-black uppercase tracking-wider border-b-2 border-black pb-1 mb-3">
            Scale Parameters
          </h2>
          
          <div class="flex flex-col gap-4">
            <!-- EDO Input -->
            <div>
              <label for="edoInput" class="block text-xs font-black uppercase text-black mb-1">
                Equal Division of Octave (EDO)
              </label>
              <input 
                type="number" 
                id="edoInput" 
                min="1" 
                max="300" 
                value="31" 
                class="w-full bg-white border-2 border-black rounded-none px-2 py-1.5 text-black focus:outline-none text-lg font-black"
              />
            </div>

            <!-- Steps Input -->
            <div>
              <label for="stepsInput" class="block text-xs font-black uppercase text-black mb-1">
                Scale Steps (EDOsteps)
              </label>
              <textarea 
                id="stepsInput" 
                rows="4" 
                placeholder="e.g. 5, 10, 15, 18, 23, 28, 30, 35, 40, 45, 48, 53, 58"
                class="w-full bg-white border-2 border-black rounded-none p-2 text-black focus:outline-none font-mono text-xs leading-relaxed font-bold"
              >5, 10, 15, 18, 23, 28, 30, 35, 40, 45, 48, 53, 58</textarea>
              <p class="text-[11px] text-zinc-700 mt-1 font-bold">
                Root (0) implied. Separate with spaces/commas. Steps &gt; EDO extend into outer octave rings.
              </p>
            </div>

            <!-- Presets -->
            <div>
              <label class="block text-[10px] font-black uppercase tracking-wider text-black mb-1.5">Presets</label>
              <div class="flex flex-wrap gap-1.5">
                <button onclick="loadPreset(31, '5 10 15 18 23 28 30 35 40 45 48 53 58')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  31-EDO Double Lydian
                </button>
                <button onclick="loadPreset(12, '2 4 5 7 9 11')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  12-EDO Major
                </button>
                <button onclick="loadPreset(19, '3 6 8 11 14 17')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  19-EDO Major
                </button>
                <button onclick="loadPreset(22, '3 7 9 12 16 18')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  22-EDO Superpyth
                </button>
              </div>
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-2 pt-2 border-t-2 border-black">
              <label class="flex items-center gap-1.5 text-xs font-black text-black cursor-pointer select-none">
                <input type="checkbox" id="showNumbers" checked class="w-4 h-4 border-2 border-black accent-black">
                Step Numbers
              </label>
              <label class="flex items-center gap-1.5 text-xs font-black text-black cursor-pointer select-none">
                <input type="checkbox" id="connectPolygon" checked class="w-4 h-4 border-2 border-black accent-black">
                Scale Polygon
              </label>
            </div>
          </div>
        </div>

        <!-- Scale Info summary -->
        <div id="scaleSummary" class="bg-zinc-100 rounded-none p-3 border-2 border-black text-xs space-y-1 font-mono font-bold">
          <!-- Filled dynamically -->
        </div>

        <!-- Export Action -->
        <button id="exportBtn" class="w-full bg-black hover:bg-zinc-800 text-white font-black py-2.5 px-4 rounded-none transition flex items-center justify-center gap-2 text-xs uppercase tracking-wider border-2 border-black">
          Export PNG Image
        </button>
      </section>

      <!-- Diagram Display -->
      <section class="lg:col-span-7 bg-white border-4 border-black p-3 sm:p-5 rounded-none flex flex-col items-center justify-center min-h-[480px]">
        <div class="relative w-full max-w-[520px] aspect-square flex items-center justify-center">
          <canvas id="scaleCanvas" class="w-full h-full block bg-white border-2 border-black"></canvas>
        </div>

        <!-- Octave Legend -->
        <div id="octaveLegend" class="flex flex-wrap items-center justify-center gap-3 mt-4 text-xs font-black">
          <!-- Dynamically populated legend -->
        </div>
      </section>
    </div>
  </div>

  <script>
    // Monochrome high-contrast palette optimized for e-ink displays (Paperwhite)
    const OCTAVE_STYLES = [
      { fill: '#000000', text: '#ffffff', stroke: '#000000', label: 'Octave 1', pattern: 'solid' },
      { fill: '#ffffff', text: '#000000', stroke: '#000000', label: 'Octave 2', pattern: 'inverted' },
      { fill: '#666666', text: '#ffffff', stroke: '#000000', label: 'Octave 3', pattern: 'gray' },
      { fill: '#e6e6e6', text: '#000000', stroke: '#000000', label: 'Octave 4', pattern: 'light-gray' }
    ];

    const edoInput = document.getElementById('edoInput');
    const stepsInput = document.getElementById('stepsInput');
    const showNumbers = document.getElementById('showNumbers');
    const connectPolygon = document.getElementById('connectPolygon');
    const canvas = document.getElementById('scaleCanvas');
    const ctx = canvas.getContext('2d');
    const summaryDiv = document.getElementById('scaleSummary');
    const legendDiv = document.getElementById('octaveLegend');
    const exportBtn = document.getElementById('exportBtn');

    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const size = Math.min(rect.width, rect.height) || 500;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.scale(dpr, dpr);
      return size;
    }

    function parseInputs() {
      const edo = parseInt(edoInput.value, 10) || 12;
      const rawText = stepsInput.value.replace(/,/g, ' ');
      const tokens = rawText.trim().split(/\s+/).filter(t => t.length > 0);
      
      let userSteps = tokens.map(t => parseInt(t, 10)).filter(n => !isNaN(n));
      if (!userSteps.includes(0)) {
        userSteps.push(0);
      }

      userSteps = [...new Set(userSteps)].sort((a, b) => a - b);
      const maxStep = Math.max(...userSteps);
      
      let octavesNeeded = 1;
      if (maxStep >= edo) {
        octavesNeeded = Math.floor(maxStep / edo) + 1;
      }
      
      const equave = octavesNeeded * edo;
      return { edo, steps: userSteps, octavesNeeded, equave, maxStep };
    }

    function render() {
      const displaySize = setupCanvas();
      const center = displaySize / 2;
      const { edo, steps, octavesNeeded, equave } = parseInputs();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // E-Paper Pure White Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, displaySize, displaySize);

      const baseRadius = displaySize * 0.38;
      const ringSpacing = octavesNeeded > 1 ? Math.min(34, (displaySize * 0.18) / octavesNeeded) : 0;

      // Summary Data
      let stepsDiff = [];
      for (let i = 0; i < steps.length; i++) {
        const next = i < steps.length - 1 ? steps[i + 1] : equave;
        stepsDiff.push(next - steps[i]);
      }

      summaryDiv.innerHTML = `
        <div class="flex justify-between border-b border-black pb-1">
          <span>Degrees:</span>
          <span class="font-black">${steps.length}</span>
        </div>
        <div class="flex justify-between border-b border-black pb-1">
          <span>Octaves:</span>
          <span class="font-black">${octavesNeeded} (${equave} EDOsteps)</span>
        </div>
        <div class="flex justify-between">
          <span>Pattern:</span>
          <span class="font-black">${stepsDiff.join('-')}</span>
        </div>
      `;

      // Legend
      legendDiv.innerHTML = '';
      for (let o = 0; o < octavesNeeded; o++) {
        const style = OCTAVE_STYLES[o % OCTAVE_STYLES.length];
        const item = document.createElement('div');
        item.className = 'flex items-center gap-1.5 text-black border-2 border-black bg-white px-2 py-0.5';
        item.innerHTML = `
          <span class="w-3.5 h-3.5 rounded-full inline-block border-2 border-black" style="background-color: ${style.fill}"></span>
          <span>Oct ${o + 1} (${o * edo}–${(o + 1) * edo - 1})</span>
        `;
        legendDiv.appendChild(item);
      }

      // Concentric Rings for Octaves
      for (let o = 0; o < octavesNeeded; o++) {
        const r = baseRadius + (o * ringSpacing);
        ctx.beginPath();
        ctx.arc(center, center, r, 0, Math.PI * 2);
        
        if (o === 0) {
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([]);
        } else if (o === 1) {
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]); // Dashed outer ring for Octave 2
        } else {
          ctx.strokeStyle = '#666666';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([2, 2]); // Dotted for higher octaves
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Radial Tick Lines (EDO steps)
      for (let s = 0; s < edo; s++) {
        const angle = (s / edo) * 2 * Math.PI - (Math.PI / 2);
        const innerR = baseRadius - 8;
        const outerR = baseRadius + ((octavesNeeded - 1) * ringSpacing) + 8;

        const x1 = center + innerR * Math.cos(angle);
        const y1 = center + innerR * Math.sin(angle);
        const x2 = center + outerR * Math.cos(angle);
        const y2 = center + outerR * Math.sin(angle);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        if (s === 0) {
          // Top root line (0 EDOstep)
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 4;
        } else {
          ctx.strokeStyle = '#a1a1aa';
          ctx.lineWidth = 1.5;
        }
        ctx.stroke();
      }

      // Pre-calculate step positions
      const stepPoints = steps.map(step => {
        const octaveIndex = Math.floor(step / edo);
        const r = baseRadius + (octaveIndex * ringSpacing);
        const edoFraction = (step % edo) / edo;
        const angle = edoFraction * 2 * Math.PI - (Math.PI / 2);

        return {
          step,
          octaveIndex,
          r,
          angle,
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle)
        };
      });

      // Polygon Scale Connections
      if (connectPolygon.checked && stepPoints.length > 1) {
        ctx.beginPath();
        stepPoints.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });

        // Top equave
        const equavePt = {
          x: center + (baseRadius + (Math.floor(equave / edo) * ringSpacing)) * Math.cos(-Math.PI / 2),
          y: center + (baseRadius + (Math.floor(equave / edo) * ringSpacing)) * Math.sin(-Math.PI / 2)
        };
        ctx.lineTo(equavePt.x, equavePt.y);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Step Nodes & Numbers
      stepPoints.forEach(pt => {
        const style = OCTAVE_STYLES[pt.octaveIndex % OCTAVE_STYLES.length];
        const nodeRadius = octavesNeeded > 3 ? 12 : 15;

        // Node Circle Background
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, nodeRadius, 0, Math.PI * 2);
        ctx.fillStyle = style.fill;
        ctx.fill();

        // Thick Black Border for e-ink definition
        ctx.lineWidth = 3;
        ctx.strokeStyle = style.stroke;
        ctx.stroke();

        // Extra outer ring for Octave 2+ to distinguish without color
        if (pt.octaveIndex > 0) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, nodeRadius + 3, 0, Math.PI * 2);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#000000';
          ctx.stroke();
        }

        // Numbers inside node
        if (showNumbers.checked) {
          ctx.fillStyle = style.text;
          ctx.font = `900 ${nodeRadius * 0.95}px system-ui, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(pt.step.toString(), pt.x, pt.y + 0.5);
        }
      });

      // Center Title Text
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.font = '900 24px system-ui, sans-serif';
      ctx.fillText(`${edo}-EDO`, center, center - 8);

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillText(`${steps.length} DEGREES`, center, center + 14);
    }

    function loadPreset(edo, steps) {
      edoInput.value = edo;
      stepsInput.value = steps;
      render();
    }

    exportBtn.addEventListener('click', () => {
      const tempLink = document.createElement('a');
      tempLink.download = `EDO_${edoInput.value}_Paperwhite_Diagram.png`;
      tempLink.href = canvas.toDataURL('image/png');
      tempLink.click();
    });

    [edoInput, stepsInput, showNumbers, connectPolygon].forEach(elem => {
      elem.addEventListener('input', render);
      elem.addEventListener('change', render);
    });

    window.addEventListener('resize', render);
    window.onload = render;
  </script>
</body>
</html>
