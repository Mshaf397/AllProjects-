<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDO Scale Circle Diagram Generator (Low RAM)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex flex-col items-center">

  <div class="max-w-5xl w-full flex flex-col gap-5">
    <!-- Header -->
    <header class="text-center border-b-4 border-black pb-3">
      <h1 class="text-2xl sm:text-3xl font-black text-black uppercase tracking-wider">
        EDO Scale Circle Generator
      </h1>
      <p class="text-xs sm:text-sm font-bold text-zinc-700 mt-1">
        Low-Memory & E-Paper Optimized Edition
      </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <!-- Input Panel -->
      <section class="lg:col-span-5 bg-white border-4 border-black p-4 rounded-none flex flex-col gap-4 shadow-none">
        <div>
          <h2 class="text-base font-black text-black uppercase tracking-wider border-b-2 border-black pb-1 mb-3">
            Scale Parameters
          </h2>
          
          <div class="flex flex-col gap-4">
            <!-- EDO Input -->
            <div>
              <label for="edoInput" class="block text-xs font-black uppercase text-black mb-1">
                Equal Division of Octave (EDO)
              </label>
              <input 
                type="number" 
                id="edoInput" 
                min="1" 
                max="300" 
                value="31" 
                class="w-full bg-white border-2 border-black rounded-none px-2 py-1.5 text-black focus:outline-none text-lg font-black"
              />
            </div>

            <!-- Steps Input -->
            <div>
              <label for="stepsInput" class="block text-xs font-black uppercase text-black mb-1">
                Scale Steps (EDOsteps)
              </label>
              <textarea 
                id="stepsInput" 
                rows="4" 
                placeholder="e.g. 5, 10, 15, 18, 23, 28, 30, 35, 40, 45, 48, 53, 58"
                class="w-full bg-white border-2 border-black rounded-none p-2 text-black focus:outline-none font-mono text-xs leading-relaxed font-bold"
              >5, 10, 15, 18, 23, 28, 30, 35, 40, 45, 48, 53, 58</textarea>
              <p class="text-[11px] text-zinc-700 mt-1 font-bold">
                Root (0) implied. Separate with spaces/commas. Steps &gt; EDO extend into outer octave rings.
              </p>
            </div>

            <!-- Presets -->
            <div>
              <label class="block text-[10px] font-black uppercase tracking-wider text-black mb-1.5">Presets</label>
              <div class="flex flex-wrap gap-1.5">
                <button onclick="loadPreset(31, '5 10 15 18 23 28 30 35 40 45 48 53 58')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  31-EDO Double Lydian
                </button>
                <button onclick="loadPreset(12, '2 4 5 7 9 11')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  12-EDO Major
                </button>
                <button onclick="loadPreset(19, '3 6 8 11 14 17')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  19-EDO Major
                </button>
                <button onclick="loadPreset(22, '3 7 9 12 16 18')" class="text-xs font-black bg-white hover:bg-black hover:text-white text-black border-2 border-black py-1 px-2 transition">
                  22-EDO Superpyth
                </button>
              </div>
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-2 pt-2 border-t-2 border-black">
              <label class="flex items-center gap-1.5 text-xs font-black text-black cursor-pointer select-none">
                <input type="checkbox" id="showNumbers" checked class="w-4 h-4 border-2 border-black accent-black">
                Step Numbers
              </label>
              <label class="flex items-center gap-1.5 text-xs font-black text-black cursor-pointer select-none">
                <input type="checkbox" id="connectPolygon" checked class="w-4 h-4 border-2 border-black accent-black">
                Scale Polygon
              </label>
            </div>
          </div>
        </div>

        <!-- Scale Info summary -->
        <div id="scaleSummary" class="bg-zinc-100 rounded-none p-3 border-2 border-black text-xs space-y-1 font-mono font-bold">
          <!-- Filled dynamically -->
        </div>

        <!-- Export Action -->
        <button id="exportBtn" class="w-full bg-black hover:bg-zinc-800 text-white font-black py-2.5 px-4 rounded-none transition flex items-center justify-center gap-2 text-xs uppercase tracking-wider border-2 border-black">
          Export PNG Image
        </button>
      </section>

      <!-- Diagram Display -->
      <section class="lg:col-span-7 bg-white border-4 border-black p-3 sm:p-5 rounded-none flex flex-col items-center justify-center min-h-[480px]">
        <div class="relative w-full max-w-[520px] aspect-square flex items-center justify-center">
          <canvas id="scaleCanvas" class="w-full h-full block bg-white border-2 border-black"></canvas>
        </div>

        <!-- Octave Legend -->
        <div id="octaveLegend" class="flex flex-wrap items-center justify-center gap-3 mt-4 text-xs font-black">
          <!-- Dynamically populated legend -->
        </div>
      </section>
    </div>
  </div>

  <script>
    // Cached Octave Styles
    const OCTAVE_STYLES = [
      { fill: '#000000', text: '#ffffff', stroke: '#000000', label: 'Octave 1' },
      { fill: '#ffffff', text: '#000000', stroke: '#000000', label: 'Octave 2' },
      { fill: '#666666', text: '#ffffff', stroke: '#000000', label: 'Octave 3' },
      { fill: '#e6e6e6', text: '#000000', stroke: '#000000', label: 'Octave 4' }
    ];

    // DOM Caching
    const edoInput = document.getElementById('edoInput');
    const stepsInput = document.getElementById('stepsInput');
    const showNumbers = document.getElementById('showNumbers');
    const connectPolygon = document.getElementById('connectPolygon');
    const canvas = document.getElementById('scaleCanvas');
    const ctx = canvas.getContext('2d');
    const summaryDiv = document.getElementById('scaleSummary');
    const legendDiv = document.getElementById('octaveLegend');
    const exportBtn = document.getElementById('exportBtn');

    let renderDebounceTimer = null;

    // Cap DPR scaling to max 2.0 to conserve canvas memory buffer
    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const size = Math.min(rect.width, rect.height) || 500;
      canvas.width = Math.floor(size * dpr);
      canvas.height = Math.floor(size * dpr);
      ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform before scaling
      ctx.scale(dpr, dpr);
      return size;
    }

    function parseInputs() {
      const edo = Math.max(1, parseInt(edoInput.value, 10) || 12);
      const rawText = stepsInput.value;
      
      let maxStep = 0;
      let userSteps = [];
      let hasZero = false;

      // In-place regex scanning to reduce array allocations
      const matches = rawText.match(/\d+/g);
      if (matches) {
        for (let i = 0; i < matches.length; i++) {
          const num = parseInt(matches[i], 10);
          if (!isNaN(num)) {
            if (num === 0) hasZero = true;
            userSteps.push(num);
            if (num > maxStep) maxStep = num;
          }
        }
      }

      if (!hasZero) userSteps.push(0);

      // Unique sort
      userSteps.sort((a, b) => a - b);
      let uniqueCount = 0;
      for (let i = 0; i < userSteps.length; i++) {
        if (i === 0 || userSteps[i] !== userSteps[i - 1]) {
          userSteps[uniqueCount++] = userSteps[i];
        }
      }
      userSteps.length = uniqueCount;

      const octavesNeeded = maxStep >= edo ? Math.floor(maxStep / edo) + 1 : 1;
      const equave = octavesNeeded * edo;

      return { edo, steps: userSteps, octavesNeeded, equave };
    }

    function render() {
      const displaySize = setupCanvas();
      const center = displaySize / 2;
      const { edo, steps, octavesNeeded, equave } = parseInputs();

      // Clear canvas buffer
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, displaySize, displaySize);

      const baseRadius = displaySize * 0.38;
      const ringSpacing = octavesNeeded > 1 ? Math.min(34, (displaySize * 0.18) / octavesNeeded) : 0;

      // Build Summary string
      let diffStr = '';
      for (let i = 0; i < steps.length; i++) {
        const next = i < steps.length - 1 ? steps[i + 1] : equave;
        diffStr += (i > 0 ? '-' : '') + (next - steps[i]);
      }

      summaryDiv.innerHTML = `
        <div class="flex justify-between border-b border-black pb-1"><span>Degrees:</span><span class="font-black">${steps.length}</span></div>
        <div class="flex justify-between border-b border-black pb-1"><span>Octaves:</span><span class="font-black">${octavesNeeded} (${equave} steps)</span></div>
        <div class="flex justify-between"><span>Pattern:</span><span class="font-black">${diffStr}</span></div>
      `;

      // Legend update via string template (avoids GC allocations)
      let legendHtml = '';
      for (let o = 0; o < octavesNeeded; o++) {
        const style = OCTAVE_STYLES[o % OCTAVE_STYLES.length];
        legendHtml += `<div class="flex items-center gap-1.5 text-black border-2 border-black bg-white px-2 py-0.5">
          <span class="w-3.5 h-3.5 rounded-full inline-block border-2 border-black" style="background-color: ${style.fill}"></span>
          <span>Oct ${o + 1} (${o * edo}–${(o + 1) * edo - 1})</span>
        </div>`;
      }
      legendDiv.innerHTML = legendHtml;

      // Draw Rings
      for (let o = 0; o < octavesNeeded; o++) {
        const r = baseRadius + (o * ringSpacing);
        ctx.beginPath();
        ctx.arc(center, center, r, 0, 6.28318);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = o === 0 ? 2.5 : 1.5;
        if (o > 0) ctx.setLineDash([4, 4]);
        ctx.stroke();
        if (o > 0) ctx.setLineDash([]);
      }

      // Draw Radial Lines
      const twoPi = Math.PI * 2;
      const halfPi = Math.PI / 2;
      for (let s = 0; s < edo; s++) {
        const angle = (s / edo) * twoPi - halfPi;
        const innerR = baseRadius - 8;
        const outerR = baseRadius + ((octavesNeeded - 1) * ringSpacing) + 8;

        ctx.beginPath();
        ctx.moveTo(center + innerR * Math.cos(angle), center + innerR * Math.sin(angle));
        ctx.lineTo(center + outerR * Math.cos(angle), center + outerR * Math.sin(angle));
        ctx.strokeStyle = s === 0 ? '#000000' : '#a1a1aa';
        ctx.lineWidth = s === 0 ? 4 : 1.5;
        ctx.stroke();
      }

      // Scale Points
      const numSteps = steps.length;
      const pointsX = new Float32Array(numSteps);
      const pointsY = new Float32Array(numSteps);
      const octaveIndices = new Uint8Array(numSteps);

      for (let i = 0; i < numSteps; i++) {
        const step = steps[i];
        const octIdx = Math.floor(step / edo);
        const r = baseRadius + (octIdx * ringSpacing);
        const angle = ((step % edo) / edo) * twoPi - halfPi;

        pointsX[i] = center + r * Math.cos(angle);
        pointsY[i] = center + r * Math.sin(angle);
        octaveIndices[i] = octIdx;
      }

      // Draw Scale Polygon
      if (connectPolygon.checked && numSteps > 1) {
        ctx.beginPath();
        ctx.moveTo(pointsX[0], pointsY[0]);
        for (let i = 1; i < numSteps; i++) {
          ctx.lineTo(pointsX[i], pointsY[i]);
        }
        // Connect to equave top point
        const eqR = baseRadius + (Math.floor(equave / edo) * ringSpacing);
        ctx.lineTo(center, center - eqR);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Nodes
      const nodeRadius = octavesNeeded > 3 ? 12 : 15;
      const drawNumbers = showNumbers.checked;

      for (let i = 0; i < numSteps; i++) {
        const px = pointsX[i];
        const py = pointsY[i];
        const octIdx = octaveIndices[i];
        const style = OCTAVE_STYLES[octIdx % OCTAVE_STYLES.length];

        ctx.beginPath();
        ctx.arc(px, py, nodeRadius, 0, twoPi);
        ctx.fillStyle = style.fill;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = style.stroke;
        ctx.stroke();

        if (octIdx > 0) {
          ctx.beginPath();
          ctx.arc(px, py, nodeRadius + 3, 0, twoPi);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#000000';
          ctx.stroke();
        }

        if (drawNumbers) {
          ctx.fillStyle = style.text;
          ctx.font = `900 ${nodeRadius * 0.95}px system-ui, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(steps[i].toString(), px, py + 0.5);
        }
      }

      // Center Title Text
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.font = '900 24px system-ui, sans-serif';
      ctx.fillText(`${edo}-EDO`, center, center - 8);

      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillText(`${numSteps} DEGREES`, center, center + 14);
    }

    // Debounce rendering for keypresses
    function debouncedRender() {
      if (renderDebounceTimer) clearTimeout(renderDebounceTimer);
      renderDebounceTimer = setTimeout(render, 150);
    }

    function loadPreset(edo, steps) {
      edoInput.value = edo;
      stepsInput.value = steps;
      render();
    }

    exportBtn.addEventListener('click', () => {
      const tempLink = document.createElement('a');
      tempLink.download = `EDO_${edoInput.value}_Paperwhite_Diagram.png`;
      tempLink.href = canvas.toDataURL('image/png');
      tempLink.click();
    });

    // Attach debounced listeners
    [edoInput, stepsInput].forEach(elem => elem.addEventListener('input', debouncedRender));
    [showNumbers, connectPolygon].forEach(elem => elem.addEventListener('change', render));

    window.addEventListener('resize', debouncedRender);
    window.onload = render;
  </script>
</body>
</html>
